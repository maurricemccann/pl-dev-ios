name: logic

# The plain logic (PLDevCore) compiles and its tests run on Linux on every push: about a minute, no Mac.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The scan reads the whole history, so the checkout must bring all of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Swift
        run: swift --version
      - name: Test
        run: swift test --package-path PLDevCore
      - name: Check the project file
        run: python3 scripts/check_pbxproj.py
      - name: Hygiene scan
        run: bash scripts/scan.sh
