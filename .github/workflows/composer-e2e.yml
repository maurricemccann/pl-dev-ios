name: composer-e2e

# Started by hand, or by a push to wave-composer2 that touches Composer or its tests (a new workflow cannot be dispatched until it is on main). Builds PL DEV for the iPhone simulator, seeds the simulator's Photos with generated pictures and a clip (never his
# media), then DRIVES Composer with XCUITest (PLDevUITests): taps, a drag to reorder, the Photos picker, the library panes, the spec, the
# preview, the graph. Every step is screenshotted into the artifact `composer-e2e`, with the accessibility tree where a step missed.
# Runs with NO config: public addresses and dummy key names only (what a stranger can reach), the same as screens.yml.
on:
  push:
    branches: [wave-composer2]
    paths: ['PLDevUITests/**', '.github/workflows/composer-e2e.yml', 'PLDev/Sections/Composer/**']
  workflow_dispatch:
    inputs:
      only:
        description: "Run one test, e.g. test2_PhotosPicker (blank = all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build the app for the simulator
        run: |
          if ! xcodebuild -project PLDev.xcodeproj -scheme PLDev -configuration Debug -sdk iphonesimulator \
               -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
               CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1; then
            grep -E "error:" sim.log | awk '!seen[$0]++' | head -60; exit 1
          fi
          tail -n 3 sim.log

      - name: Boot a phone, install the app, seed Photos
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r in d for x in d[r] if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']];print(c[-1]['udid'])")
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find dd -type d -name "PLDev.app" -path "*iphonesimulator*" 2>/dev/null | head -1); echo "app: $APP"; [ -n "$APP" ] || exit 1
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"); echo "BID=$BID" >> $GITHUB_ENV
          # generated test media: three pictures and a two-second clip
          mkdir -p media && swift PLDevUITests/make_media.swift media
          xcrun simctl addmedia "$DEV" media/pl-test-photo-1.jpg media/pl-test-photo-2.jpg media/pl-test-photo-3.jpg media/pl-test-clip.mov
          # the config: public addresses, key names with dummy values, no origin carries auth, so no key is ever sent
          DATA=$(xcrun simctl get_app_container "$DEV" "$BID" data)
          mkdir -p "$DATA/Documents"
          cat > "$DATA/Documents/sim-config.json" <<'JSON'
          {"v":1,"sections":["house","capture","curate","library","pick","composer","town","paint","shop","congregation","practice","glyphbot","status"],
           "origins":{"cron":{"base":"https://pl-cron.psychedluxuries.com/"},"console":{"base":"https://pl-cron.psychedluxuries.com/"},
             "gallery":{"base":"https://pl-curve-library.psychedluxuries.workers.dev/"},"site":{"base":"https://psychedluxuries.com/"},
             "composer":{"base":"https://pl-composer.psychedluxuries.workers.dev/"},"os":{"base":"https://plos.beta.psychedluxuries.com/"},
             "practice":{"base":"https://pl-manifestation-practice.psychedluxuries.workers.dev/"},"interview":{"base":"https://pl-cron.psychedluxuries.com/"},
             "paint":{"base":"https://pl-cron.psychedluxuries.com/api/paint/"}},
           "keys":{"widgetRead":"sim-no-key","widgetWrite":"sim-no-key","paintSync":"sim-no-key","debug":"sim-no-key","vault":"sim-no-key","call":"sim-no-key","board":"sim-no-key","pldev":"sim-no-key","interview":"sim-no-key","composer":"sim-no-key"}}
          JSON
          echo "PL_SIM_CONFIG=$DATA/Documents/sim-config.json" >> $GITHUB_ENV

      - name: Drive Composer
        run: |
          mkdir -p shots
          ONLY=""
          [ -n "${{ inputs.only }}" ] && ONLY="-only-testing:PLDevUITests/ComposerFlowsTests/${{ inputs.only }}"
          set +e
          TEST_RUNNER_PL_SIM_CONFIG="$PL_SIM_CONFIG" TEST_RUNNER_PL_SHOTS_DIR="$PWD/shots" \
            xcodebuild test -project PLDevUITests/PLDevUITests.xcodeproj -scheme PLDevUITests \
              -destination "id=$DEV" -resultBundlePath result.xcresult $ONLY \
              CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          echo "xcodebuild exit: $?" | tee shots/exit.txt
          set -e
          grep -E "error:|Test Case .* (passed|failed)|Executed|\*\* TEST" test.log | awk '!seen[$0]++' | head -80 | tee shots/summary.txt
          xcrun xcresulttool get test-results summary --path result.xcresult > shots/results.json 2>/dev/null || true
          cp test.log shots/test.log
          ls shots | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-e2e
          path: shots
          retention-days: 5

      - name: Fail the job when a test failed
        run: grep -q "TEST SUCCEEDED" test.log
