name: screens

# Started by hand only. Builds PL DEV for the iPhone simulator, opens every section and room by its pldev:// link and
# screenshots each one, so the lead can look at the real app beside the live web pages before the founder tests.
# Runs with NO config: no key, no private data, nothing private reaches the artifact (this repo is public).
on:
  workflow_dispatch:
    inputs:
      links:
        description: "Space-separated pldev:// paths after pldev:// (blank = every section and room)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Build for the simulator
        run: |
          if ! xcodebuild -project PLDev.xcodeproj -scheme PLDev -configuration Debug -sdk iphonesimulator \
               -destination 'generic/platform=iOS Simulator' -derivedDataPath dd \
               CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1; then
            grep -E "error:" sim.log | awk '!seen[$0]++' | head -60; exit 1
          fi
          tail -n 3 sim.log

      - name: Boot a phone
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for r in d for x in d[r] if 'iPhone' in x['name'] and 'Pro' in x['name'] and 'Max' not in x['name']];print(c[-1]['udid'])")
          echo "DEV=$DEV" >> $GITHUB_ENV
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance dark
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build dd -type d -name "PLDev.app" -path "*iphonesimulator*" 2>/dev/null | head -1); echo "app: $APP"; [ -n "$APP" ] || { find build -maxdepth 3 -type d | head -20; exit 1; }
          xcrun simctl install "$DEV" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"); echo "BID=$BID" >> $GITHUB_ENV

      - name: Screenshot every section and room
        run: |
          mkdir -p shots
          # Public addresses only, no private network; key NAMES with dummy values so every section opens (no origin carries auth, so no key is ever sent): what any stranger can already reach. Keyed screens show their keyless state.
          DATA=$(xcrun simctl get_app_container "$DEV" "$BID" data)
          mkdir -p "$DATA/Documents"
          cat > "$DATA/Documents/sim-config.json" <<'JSON'
          {"v":1,"sections":["house","capture","curate","library","pick","composer","town","paint","shop","congregation","practice","glyphbot","status"],
           "origins":{"cron":{"base":"https://pl-cron.psychedluxuries.com/"},"console":{"base":"https://pl-cron.psychedluxuries.com/"},
             "gallery":{"base":"https://pl-curve-library.psychedluxuries.workers.dev/"},"site":{"base":"https://psychedluxuries.com/"},
             "composer":{"base":"https://pl-composer.psychedluxuries.workers.dev/"},"os":{"base":"https://plos.beta.psychedluxuries.com/"},
             "practice":{"base":"https://pl-manifestation-practice.psychedluxuries.workers.dev/"},"interview":{"base":"https://pl-cron.psychedluxuries.com/"},
             "paint":{"base":"https://pl-cron.psychedluxuries.com/api/paint/"}},
           "keys":{"widgetRead":"sim-no-key","widgetWrite":"sim-no-key","paintSync":"sim-no-key","debug":"sim-no-key","vault":"sim-no-key","call":"sim-no-key","board":"sim-no-key","pldev":"sim-no-key","interview":"sim-no-key","composer":"sim-no-key"}}
          JSON
          CFG="$DATA/Documents/sim-config.json"
          LINKS="${{ inputs.links }}"
          [ -z "$LINKS" ] \&\& LINKS="home section/house section/status section/shop section/shop/curve section/congregation section/practice section/practice/affirmations section/practice/preview section/glyphbot section/glyphbot/record section/library section/library/curves section/library/live section/library/archive section/library/space section/library/kit section/library/forge section/library/labs section/library/worlds section/curate section/pick section/town section/town/lore section/capture section/composer section/paint section/house/calendar section/house/atlas settings"
          xcrun simctl launch "$DEV" "$BID" -simConfig "$CFG"; sleep 15
          xcrun simctl io "$DEV" screenshot shots/00-launch.png
          i=1
          for l in $LINKS; do
            n=$(printf "%02d" $i)-$(echo "$l" | tr '/' '-')
            xcrun simctl terminate "$DEV" "$BID" || true
            xcrun simctl launch "$DEV" "$BID" -simConfig "$CFG" -simLink "pldev://$l"; sleep 12
            xcrun simctl io "$DEV" screenshot "shots/$n.png"
            i=$((i+1))
          done
          ls shots | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots
          retention-days: 3
